name: Silt
options:
  bundleIdPrefix: com.sabeur
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Silt:
    type: application
    platform: macOS
    sources:
      - path: Sources/Silt
    settings:
      base:
        PRODUCT_NAME: Silt
        PRODUCT_BUNDLE_IDENTIFIER: com.sabeur.silt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Personal utility. No data leaves this Mac."
        INFOPLIST_KEY_CFBundleDisplayName: Silt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

  SiltTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SiltTests
      - path: Sources/Silt/Models
      - path: Sources/Silt/Services/SafetyGuard.swift
      - path: Sources/Silt/Services/InstalledApps.swift
      - path: Sources/Silt/Services/LeftoverScanner.swift
      - path: Sources/Silt/Services/Scanner.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sabeur.silt.tests
        GENERATE_INFOPLIST_FILE: YES
