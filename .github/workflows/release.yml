name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Signed build
    runs-on: macos-15
    permissions:
      contents: write
    env:
      KEYCHAIN: build.keychain
      KEYCHAIN_PASSWORD: ci-throwaway
      HAS_NOTARY: ${{ secrets.APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm /tmp/cert.p12
          # Apple's Developer ID intermediate, in case the runner image lacks it
          curl -sO https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import DeveloperIDG2CA.cer -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security find-identity -p codesigning -v "$KEYCHAIN"

      - name: Build signed dmg
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: make dmg TEAM_ID="$TEAM_ID"

      - name: Notarize and staple
        if: env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls dist/*.dmg)
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Silt-dmg
          path: dist/*.dmg

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.dmg \
            --title "Silt ${GITHUB_REF_NAME}" --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" dist/*.dmg --clobber

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN" || true

  # ── Update Homebrew tap (kirodex pattern) ────────────────────────
  homebrew:
    name: Update Homebrew cask
    needs: [release]
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download dmg and compute hash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG="Silt-${VERSION}.dmg"
          for i in $(seq 1 12); do
            echo "Attempt $i: downloading ${DMG}..."
            if gh release download "${GITHUB_REF_NAME}" \
                 --repo "${{ github.repository }}" \
                 --pattern "${DMG}" --dir /tmp 2>/dev/null; then
              break
            fi
            [ "$i" -eq 12 ] && { echo "::error::Failed to download ${DMG}"; exit 1; }
            sleep 15
          done
          echo "SHA256=$(shasum -a 256 /tmp/${DMG} | awk '{print $1}')" >> $GITHUB_ENV

      - name: Update homebrew cask
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::GH_PAT secret is not set — required to push to homebrew-tap"
            exit 1
          fi
          git clone "https://x-access-token:${GH_TOKEN}@github.com/thabti/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          mkdir -p Casks
          sed -e "s|{{VERSION}}|${VERSION}|g" \
              -e "s|{{SHA256_ARM}}|${SHA256}|g" \
              "${{ github.workspace }}/.github/homebrew/Casks/silt.rb.template" > Casks/silt.rb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Casks/silt.rb
          git diff --cached --quiet || (git commit -m "Update silt to ${VERSION}" && git push)
